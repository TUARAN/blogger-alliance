name: Ledger validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate ledger
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate deals, reports and annual reports
        run: npm run ledger:validate
